name: Flutter Nightly Build

on:
  # schedule build every night
  # RustDesk-Lu: nightly schedule disabled by 璐哥哥 (2026-10-27); manual dispatch still works.
  # - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
